# HTTP-context site. No public listen 443: preserve existing stream/TURN routing.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    # Quoted regex is required because nginx otherwise parses the quantifier braces.
    server_name "~^(?!(?:www|api|admin|mail|smtp|imap|pop|pop3|webmail|autodiscover|autoconfig|voice|turn|stun|vtt|play|app|account|auth|login|support|status|cdn|assets|static|media|files|storage|download|downloads|docs|blog|shop|store|marketplace|cartography|ns1|ns2|localhost|ftp|sftp|vpn|dev|test|staging|acme)\.)(?![^.]*--)(?<dnd_store>[a-z0-9][a-z0-9-]{1,61}[a-z0-9])\.dndnerds\.ir$";
    ssl_certificate /etc/letsencrypt/live/dndnerds-stores/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dndnerds-stores/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_read_timeout 120s;
    # Trust only the existing local stream proxy to provide the client address.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name "~^(?!(?:www|api|admin|mail|smtp|imap|pop|pop3|webmail|autodiscover|autoconfig|voice|turn|stun|vtt|play|app|account|auth|login|support|status|cdn|assets|static|media|files|storage|download|downloads|docs|blog|shop|store|marketplace|cartography|ns1|ns2|localhost|ftp|sftp|vpn|dev|test|staging|acme)\.)(?![^.]*--)(?<dnd_store_http>[a-z0-9][a-z0-9-]{1,61}[a-z0-9])\.dndnerds\.ir$";
    return 308 https://$host$request_uri;
}
