services:

  postgres:
    image: postgres:18-alpine

    container_name:
      dnd-nerds-postgres

    restart:
      unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - type: bind
        source: "F:/DND NERDS PLATFORM/data/postgres"
        target: /var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  redis:
    image: redis:7-alpine

    container_name:
      dnd-nerds-redis

    restart:
      unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - type: bind
        source: "F:/DND NERDS PLATFORM/data/redis"
        target: /data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
