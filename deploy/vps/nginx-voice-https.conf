map $http_upgrade $dnd_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 94-183-163-87.sslip.io voice.94-183-163-87.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 94-183-163-87.sslip.io;
    ssl_certificate /etc/letsencrypt/live/94-183-163-87.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94-183-163-87.sslip.io/privkey.pem;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dnd_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.94-183-163-87.sslip.io;
    ssl_certificate /etc/letsencrypt/live/94-183-163-87.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94-183-163-87.sslip.io/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dnd_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
